services:
  # 1. Container Database (MySQL)
  db:
    image: mysql:8.0.44
    container_name: uts_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: uts_kepkel
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # 2. Container Backend (Laravel + FrankenPHP)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uts_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=db      # Menghubungkan backend ke container database ('db')
      - DB_PORT=3306
      - DB_DATABASE=uts_kepkel
      - DB_USERNAME=root
      - DB_PASSWORD=password
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 3. Container Frontend (Vue.js + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uts_frontend
    restart: unless-stopped
    ports:
      - "8081:80"       # Frontend bisa diakses melalui http://localhost:8081
    depends_on:
      - backend

volumes:
  db_data: # Menyimpan data database secara permanen (persistent)
